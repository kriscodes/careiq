packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  browser-tabs-lock: false
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
# Exact SDK patch alignment exceptions recorded by pnpm; future updates need review.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - '@expo/ui@57.0.22'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-auth-session@57.0.14
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo-router@57.0.25
  - expo@57.0.27
# Compatible 5.x patch; upstream resolver still selects the older tagged release.
overrides:
  # Preserve main's globally pinned query-parser security release.
  qs: 6.16.0
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
  "xcode@3.0.1>uuid": 11.1.1
  "query-string@7.1.3>decode-uri-component": 0.5.0
  "sharp@>=0.35.0 <0.35.5": 0.35.5

# Version-preserving backports; no advisory ignores or fabricated versions.
patchedDependencies:
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch
