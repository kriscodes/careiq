name: CareIQ checks

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: careiq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: careiq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d careiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/careiq_test
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/careiq_test
      DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/api db:migrate
      - name: Verify migration replay is safe
        run: pnpm --filter ./apps/api db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm security:regressions
      - run: pnpm web:associations:test
      - name: Browser workflows with synthetic identity and API fixtures
        run: |
          pnpm --fail-if-no-match --filter ./apps/web exec playwright install --with-deps chromium
          pnpm --fail-if-no-match --filter ./apps/web test:browser
      - name: Browser paperwork through the real local API and restricted database
        run: pnpm test:browser:api
      - name: Build workspaces with reserved configuration fixtures
        env:
          # Reserved .invalid fixtures cannot authenticate a real account.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsucmVsZWFzZS5pbnZhbGlkJA
          CLERK_SECRET_KEY: sk_live_release_configuration_fixture
          NEXT_PUBLIC_API_URL: https://api.release.invalid
        run: |
          pnpm --fail-if-no-match --filter @careiq/interview-contract build
          pnpm --fail-if-no-match --filter @careiq/i18n build
          pnpm --fail-if-no-match --filter @careiq/api build
          pnpm --fail-if-no-match --filter ./apps/web exec next build --webpack
          pnpm --fail-if-no-match --filter @careiq/marketing exec next build --webpack
      - run: pnpm audit --prod --audit-level moderate
