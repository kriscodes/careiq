      tags:
      - Patient delivery
      summary: Read a bounded request delivery timeline
      description: Current patient/location access required. Mask destinations; expose
        trusted normalized evidence and allowed actions. Signed cursor cannot widen
        request scope.
      parameters:
      - "$ref": "#/components/parameters/LocationId"
      - "$ref": "#/components/parameters/Id"
      - "$ref": "#/components/parameters/Cursor"
      - "$ref": "#/components/parameters/Limit"
