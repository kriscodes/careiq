components:
  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      bearerFormat: Clerk JWT
      description: Current authenticated staff token; server rechecks enrollment,
        directory policy, location and explicit action/subject access. Never reused
        by a background worker as stale authority.
    PatientPortalBearer:
      type: http
      scheme: bearer
      bearerFormat: Clerk JWT
      description: Verified patient account principal with current explicit adult-self
        portal grant, current age/location eligibility and session checks. A restricted
        request cookie/link cannot authorize these endpoints. Authentication alone
        does not establish a patient binding.
  parameters:
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Explicit current clinical location; server resolves practice and
        validates current membership/record access.
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Stable UUID for one logical actor/scope/target/body/precondition
        command. Replay same key and fingerprint returns original result; changed
        fingerprint returns 409 IDEMPOTENCY_KEY_REUSED. After timeout reconcile/replay
        original, never generate a new key blindly.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Exact quoted revision of targeted mutable request/intent/policy/receipt/permission/preferences.
        Missing 428 PRECONDITION_REQUIRED; stale 412 REVISION_CONFLICT. Read-all uses
        signed snapshot membership instead.
    IfMatchOnRotation:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Required when rotating an existing device registration or replacing
        a confirmed endpoint; omitted only for new resource creation.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque signed cursor bound to caller, authorized scope, filters
        and snapshot. Reauthorize every page; no cursor broadening.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ScopeQuery:
      name: scope
      in: query
      required: true
      schema:
        "$ref": "#/components/schemas/Scope"
      description: selected_location requires locationId; all_permitted_locations
        derives current allowed set. Browser never chooses practice authority.
    LocationQuery:
      name: locationId
      in: query
      schema:
        type: string
        format: uuid
      description: Required with selected_location. Cannot be used to expand current
        permitted locations.
    InboxFilter:
      name: filter
      in: query
      schema:
        type: string
        enum:
        - all
        - unread
        - assignments
        - overdue
        - delivery_follow_up
        default: all
  headers:
    NoStore:
      description: Protected responses are not cacheable.
      schema:
        type: string
        const: no-store
    RequestId:
      description: Safe diagnostic correlation ID; no patient data or bearer secret.
      schema:
        type: string
    ETag:
      description: Quoted current targeted resource or receipt revision; use for If-Match.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    RetryAfter:
      description: Minimum seconds until eligible retry; always recheck expiry, limits
        and authority.
      schema:
        type: integer
        minimum: 0
    Location:
      description: Durably committed status resource, normally /api/v1/delivery-intents/{intentId}.
      schema:
        type: string
        format: uri-reference
  responses:
    BadRequest:
      description: Invalid header/body/cursor or snapshot token. Codes include IDEMPOTENCY_KEY_REQUIRED,
        INVALID_PRECONDITION, SNAPSHOT_SCOPE_MISMATCH, SNAPSHOT_EXPIRED.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Unauthenticated:
      description: Current authentication unavailable.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: Explicit command capability or current location authority unavailable.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    UnavailableSubject:
      description: Uniform non-disclosing unavailable result for missing/inaccessible
        notification or delivery subject. NOTIFICATION_SUBJECT_UNAVAILABLE.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: 'State/eligibility conflict: DELIVERY_RECONCILIATION_REQUIRED,
        DELIVERY_SUPPRESSED, DELIVERY_DESTINATION_CHANGED, DELIVERY_PERMISSION_UNAVAILABLE,
        DELIVERY_WINDOW_EXPIRED, PATIENT_TIME_ZONE_UNCONFIRMED, PROVIDER_CONNECTION_DISABLED,
        IDEMPOTENCY_KEY_REUSED. No forced retry. Reconciliation/cancellation additions:
        DELIVERY_RECONCILIATION_UNAVAILABLE, DELIVERY_ALREADY_SUBMITTING. Patient
        enable remains blocked by PROVIDER_OPTOUT_ACTIVE.'
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    RevisionConflict:
      description: REVISION_CONFLICT. Return safe currentRevision; retain authorized
        draft and reload before deciding a new command.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Validation:
      description: Field/policy validation failed, including REMINDER_NOT_DUE and
        incompatible purpose/channel/version.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    PreconditionRequired:
      description: PRECONDITION_REQUIRED; missing current mutable-resource If-Match.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    RateLimited:
      description: REMINDER_COOLDOWN, DELIVERY_CAP_REACHED or bounded service rate.
        Retry-After is advisory and never overrides suppression/expiry.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Retry-After:
          "$ref": "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ServiceUnavailable:
      description: Temporary service/directory/provider lookup unavailability; no
        inference that external delivery failed. Reconcile original key/operation
        after uncertain mutation.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Retry-After:
          "$ref": "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NoContent:
      description: Device revocation persisted; invalid/revoked tokens cannot dispatch.
      headers:
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable untranslated catalog code; UI translates through
                existing EN/ES catalogs.
            message:
              type: string
              description: Safe user-facing fallback, with no provider payload or
                sensitive identifiers.
            requestId:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              properties:
                currentRevision:
                  type: integer
                  minimum: 1
                nextEligibleAt:
                  type: string
                  format: date-time
                retryAfterSeconds:
                  type: integer
                  minimum: 0
              additionalProperties: false
          required:
          - code
          - message
          - requestId
          - retryable
      required:
      - error
    Revisioned:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        concurrency:
          type: object
          properties:
            revision:
              type: integer
              minimum: 1
            ifMatch:
              type: string
              pattern: ^"[1-9][0-9]*"$
          required:
          - revision
          - ifMatch
      required:
      - revision
    EndpointReference:
      type: object
      properties:
        endpointId:
          type: string
          format: uuid
        endpointVersion:
          type: integer
          minimum: 1
      required:
      - endpointId
      - endpointVersion
      additionalProperties: false
    DeliverySelection:
      type: object
      properties:
        endpointId:
          type: string
          format: uuid
        endpointVersion:
          type: integer
          minimum: 1
        channel:
          type: string
          enum:
          - email
          - sms
      required:
      - endpointId
      - endpointVersion
      - channel
      additionalProperties: false
    DeliveryOptions:
      type: object
      properties:
        sendNow:
          type: boolean
          default: false
        selections:
          type: array
          items:
            "$ref": "#/components/schemas/DeliverySelection"
          minItems: 1
          maxItems: 2
        locale:
          type: string
          enum:
          - en
          - es
      description: Versioned proposed extension. Existing sendNow remains compatible.
        Each selected channel needs separate current permission and confirmation;
        no automatic fallback. Worker reloads endpoint/version, never trusts an arbitrary
        address from a stale command.
      additionalProperties: false
    Recipient:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        channel:
          type: string
          enum:
          - email
          - sms
          - local_review
        address:
          type: string
          maxLength: 254
          writeOnly: true
          description: Legacy protected command input. Validate and resolve a confirmed
            endpoint synchronously; stored address alone does not authorize provider
            dispatch.
      required:
      - name
      - channel
      additionalProperties: false
    CreateWorkflowRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        appointmentId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        purpose:
          type: string
          enum:
          - collection
          - signature
          - replacement
          default: collection
        items:
          type: array
          items:
            type: object
            properties:
              requirementId:
                type: string
                format: uuid
              sourceDocumentVersionId:
                type: string
                format: uuid
            required:
            - requirementId
            additionalProperties: false
          minItems: 1
          maxItems: 30
        recipient:
          "$ref": "#/components/schemas/Recipient"
        dueAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expiresAt:
          type: string
          format: date-time
        assigneeUserId:
          type: string
          maxLength: 128
        delivery:
          "$ref": "#/components/schemas/DeliveryOptions"
        reasonCode:
          type: string
          maxLength: 80
      required:
      - patientId
      - items
      description: Preserves existing command fields. Signature requires exactly one
        item and an eligible immutable sourceDocumentVersionId; replacement requires
        reasonCode. Activation adds explicitly selected confirmed endpoint versions.
        Caller cannot relax recipient/signer policy.
      additionalProperties: false
    CreatePaperworkRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        templateVersionId:
          type: string
          format: uuid
        requirementId:
          type: string
          format: uuid
        appointmentId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        recipient:
          "$ref": "#/components/schemas/Recipient"
        dueAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        expiresAt:
          type: string
          format: date-time
        delivery:
          "$ref": "#/components/schemas/DeliveryOptions"
      required:
      - patientId
      - templateVersionId
      description: Pins a published template and patient draft before freeze. Current
        source accepts only email/local_review. SMS and real dispatch are versioned
        proposal gates; adult-self and signer authority remain unchanged.
      additionalProperties: false
    ReminderCommand:
      type: object
      properties:
        reasonCode:
          type: string
          maxLength: 80
        delivery:
          "$ref": "#/components/schemas/DeliveryOptions"
      description: Existing empty/reason-only shape remains accepted. Proposed selection
        can only choose current eligible endpoints under the same intended recipient/request
        authority. A reminder gets a fresh bounded request grant without revoking
        the active patient session.
      additionalProperties: false
    ReissueCommand:
      oneOf:
      - type: object
        properties:
          reasonCode:
            type: string
            minLength: 1
            maxLength: 80
        required:
        - reasonCode
        additionalProperties: false
      - type: object
        properties:
          schemaVersion:
            type: integer
            const: 2
          reasonCode:
            type: string
            minLength: 1
            maxLength: 80
          recipientEndpoint:
            "$ref": "#/components/schemas/DeliverySelection"
        required:
        - schemaVersion
        - reasonCode
        - recipientEndpoint
        additionalProperties: false
      description: First shape is the current reason-only command. Recipient correction
        is explicitly proposed schemaVersion 2, confirms the same intended person
        authority, rotates request generation and revokes old grants/sessions. It
        cannot repair a completed-copy identity binding.
    RetryCommand:
      type: object
      properties:
        reasonCode:
          type: string
          maxLength: 80
      description: Retry only known-safe transient failure, preserving exact destination/message/provider
        idempotency generation. Unknown outcome returns DELIVERY_RECONCILIATION_REQUIRED.
      additionalProperties: false
