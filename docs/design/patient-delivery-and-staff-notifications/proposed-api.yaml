        receipt before asynchronous processing. Dedupe on connection/account/provider
        event ID and hash; same ID with changed bytes or conflicting mapping is quarantined.
        Late delivery/bounce/complaint facts remain append-only. Exact provider signature
        headers/ack body must be finalized with the selected adapter; this provider-neutral
        outline intentionally invents none.
