        '200':
          description: Read a bounded request delivery timeline; durable server facts
            only.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            ETag:
              "$ref": "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          "$ref": "#/components/schemas/DeliveryIntent"
                        maxItems: 100
                      asOf:
                        type: string
                        format: date-time
                      nextCursor:
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - items
                    - asOf
                    - nextCursor
                required:
                - data
