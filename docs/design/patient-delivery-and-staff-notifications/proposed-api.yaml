        required:
        - schemaVersion
        - reasonCode
        - replacementGrantId
        - recipientEndpoint
        additionalProperties: false
      description: 'Empty body is the current command. Explicit repair is a proposed
        privileged v2 extension: same patient/practice/location and independently
        verified portal principal, exact grant/endpoint version, same immutable notification/library/document
        version. Cannot transfer identity or override suppression; reconcile unknown
        original send first.'
