  "/api/v1/delivery-intents":
    get:
      operationId: listDeliveryIntents
      tags:
      - Patient delivery
      summary: List authorized patient delivery intents
      description: Page and exact filtered counts come from one repeatable-read snapshot.
        Mask destinations and reauthorize current patient/locations; practice scope
        derives from authenticated context. No browser-supplied practice ID confers
        authority.
      parameters:
      - "$ref": "#/components/parameters/ScopeQuery"
      - "$ref": "#/components/parameters/LocationQuery"
      - name: status
        in: query
        schema:
          type: string
          enum:
          - all
          - needs_attention
          - in_progress
          - scheduled
          - queued
          - submitting
          - accepted
          - delivered
          - retry_wait
          - failed
          - unknown
          - suppressed
          - cancelled
          default: all
      - name: purpose
        in: query
        schema:
          type: string
          enum:
          - initial
          - reminder
          - reissue
          - paperwork_ready
          - paperwork_resend
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - email
          - sms
      - name: patientId
        in: query
        schema:
          type: string
          format: uuid
      - "$ref": "#/components/parameters/Limit"
      - "$ref": "#/components/parameters/Cursor"
      responses:
        '200':
          description: List authorized patient delivery intents; durable server facts
            only.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            ETag:
