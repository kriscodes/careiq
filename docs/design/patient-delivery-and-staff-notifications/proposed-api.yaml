---
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: CareIQ notification API delta — PROPOSED, NOT INTEGRATED
  version: 0.1.0-design
  description: Design outline dated October 18, 2026. Exact route names align with
    backend-design.md section 8. No application code, migration, provider activation
    or live message delivery is implied. Existing routes retain compatible bodies/results
    until explicit reviewed version gates. All staff queries/commands derive current
    practice/location/patient authority server-side. Nonclinical provider ingress
    has a separate trust boundary. These schemas are review targets, not generated
    client compatibility promises. Proposed patient communication-preferences extension
    uses the existing authenticated account prefix and separate PatientPortalBearer
    authority.
servers:
- url: https://api.careiq.example
  description: Reserved example origin only; not a deployed environment.
security:
- StaffBearer: []
tags:
- name: Patient delivery
- name: Communication choices
- name: Policy
- name: Staff inbox
- name: Staff preferences
- name: Provider ingress
- name: Patient communication preferences
x-design-status: proposal-only; no routes integrated or verified against a provider
x-source: backend-design.md section 8
x-http-contract:
  mutation_retry: Reuse original Idempotency-Key and command fingerprint after network
    uncertainty; do not create a new external send. Conflicting reuse 409.
  mutable_precondition: If-Match quoted current revision; current source uses 428
    missing, 412 stale. Recipient receipt has its own revision.
  read_all_precondition: Signed recipient/scope/filter/expiry/materialized-ID snapshot
    token, no timestamp-only bulk boundary.
  privacy: No-store protected responses; masked lists; no raw tokens, rendered bodies,
    credentials or provider error dumps.
  provider_acceptance: queued/202 is durable intent only; accepted is provider evidence
    only; delivered is provider assertion only.
  error_status_review: New named errors/status mappings remain proposed catalog additions;
    current source stays authoritative until integration.
x-explicitly-out-of-scope-routes:
- No invented authentication, contact verification or portal identity binding route.
- No provider admin setup/activation or template publication route.
- No new source work assignment/completion route; reuse existing canonical commands.
paths:
  "/api/v1/locations/{locationId}/workflow/requests":
    post:
      operationId: createWorkflowRequest
      tags:
      - Patient delivery
      summary: Create a patient collection/signature/replacement request
      description: Existing route/body remains compatible. Proposed activated delivery
        creates durable per-channel intents and returns queued/scheduled/suppressed
        after commit; it never sends inside the transaction. Legacy 201 response may
        remain during version transition.
      parameters:
      - "$ref": "#/components/parameters/LocationId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        '202':
          description: Create a patient collection/signature/replacement request;
            durable server facts only.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Location:
              "$ref": "#/components/headers/Location"
          content:
            application/json:
              schema:
                type: object
                properties:
