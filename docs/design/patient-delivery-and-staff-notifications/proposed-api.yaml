      - id
      - state
      - revision
    PatientCommunicationPreferencesPatch:
      type: object
      properties:
        preferenceContextToken:
          type: string
          minLength: 1
        choices:
          type: array
          items:
            type: object
            properties:
              purpose:
                type: string
                enum:
                - request
                - reminder
                - paperwork
              channel:
                type: string
                enum:
                - email
                - sms
              enabled:
                type: boolean
            required:
            - purpose
            - channel
            - enabled
            additionalProperties: false
          minItems: 1
          maxItems: 6
        locale:
          type: string
          enum:
          - en
          - es
        confirmedTimeZone:
          type: string
          description: Confirmed IANA timezone; validate current TZ database.
      required:
      - preferenceContextToken
      - choices
      additionalProperties: false
      description: Token selects one current server-resolved adult-self principal/grant/scope
        context. Body cannot choose patientId, change an address, establish identity
        or create/rebind a portal grant. Duplicate purpose/channel choices rejected.
        Enabling choice never clears provider opt-out or activates unsupported paperwork
        SMS.
    PatientCommunicationPreferenceContext:
      type: object
      properties:
        preferenceContextToken:
          type: string
          description: Opaque signed expiring context selector, not authentication.
            Reauthorize account and exact current grant on each use.
        revision:
          type: integer
          minimum: 1
        locale:
          type: string
          enum:
          - en
          - es
        confirmedTimeZone:
          anyOf:
          - type: string
          - type: 'null'
        maskedEndpoints:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
                enum:
                - email
                - sms
              masked:
                type: string
              confirmed:
                type: boolean
            required:
            - channel
            - masked
            - confirmed
          maxItems: 2
        choices:
          type: array
          items:
            type: object
            properties:
              purpose:
                type: string
                enum:
                - request
                - reminder
                - paperwork
              channel:
                type: string
                enum:
                - email
                - sms
              enabled:
                type: boolean
              effectiveAllowed:
                type: boolean
              blockedReasonCode:
                anyOf:
                - type: string
                - type: 'null'
            required:
            - purpose
            - channel
            - enabled
            - effectiveAllowed
            - blockedReasonCode
          maxItems: 6
      required:
      - preferenceContextToken
      - revision
      - locale
      - confirmedTimeZone
      - maskedEndpoints
      - choices
      description: User preference and effective eligibility remain separate. Provider
        suppression, missing confirmed endpoint or unsupported channel can prevent
        effective delivery despite an enabled preference.
    PatientCommunicationPreferences:
      type: object
      properties:
        contexts:
          type: array
          items:
            "$ref": "#/components/schemas/PatientCommunicationPreferenceContext"
          maxItems: 100
        asOf:
          type: string
          format: date-time
      required:
      - contexts
      - asOf
      description: Derive current contexts from verified authenticated account and
        current explicit adult-self grants. Multiple grants require explicit context
        selection; never use email equality or browser-supplied patient ID to discover
        records.
