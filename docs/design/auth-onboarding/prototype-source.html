#careiq-access-design .cq-native .cq-support{inset:100px 12px 30px;padding:24px;}
@media(max-width:800px){#careiq-access-design .cq-product.cq-setup-mode .cq-setup-sidebar{width:200px;flex-basis:200px;padding:36px 22px;}#careiq-access-design .cq-page{padding:32px 24px 42px;}#careiq-access-design .cq-preview-platform{padding-right:0;}}
@media(max-width:600px){#careiq-access-design .cq-preview-title strong span{display:block;margin:0;}#careiq-access-design .cq-preview-screens{gap:8px;}#careiq-access-design .cq-preview-field{flex-basis:100%;max-width:100%;}#careiq-access-design .cq-product-header{padding:20px 22px;}#careiq-access-design .cq-product.cq-setup-mode .cq-setup-sidebar{display:none;}#careiq-access-design .cq-onboard-progress{display:block;margin-bottom:26px;}#careiq-access-design .cq-page{padding:24px 22px 36px;}#careiq-access-design .cq-product h1{font-size:27px;}#careiq-access-design .cq-product-footer{padding:16px 22px;justify-content:center;}#careiq-access-design .cq-footer-mark{display:none;}#careiq-access-design .cq-product-layout{min-height:550px;}#careiq-access-design .cq-input{font-size:16px!important;}#careiq-access-design #cq-preview-stage.cq-mobile-stage{padding:20px 0;}#careiq-access-design .cq-native .cq-page{padding:24px 20px 28px;}#careiq-access-design .cq-native .cq-product-header{padding:16px 20px;}#careiq-access-design .cq-support{inset:85px 10px 12px;padding:20px;}}
@media(prefers-reduced-motion:reduce){#careiq-access-design *{scroll-behavior:auto!important;}}
</style>
<script>
(() => {
 const root=document.getElementById('careiq-access-design');
 const product=root.querySelector('#cq-product'), page=root.querySelector('#cq-page'), picker=root.querySelector('#cq-screen-picker');
 const screens=[
  ['signin','Sign in','Authentication'],['signup','Create account','Authentication'],['verify','Verify email','Authentication'],['forgot','Forgot password','Authentication'],['resetemail','Reset email sent','Authentication'],['reset','New password','Authentication'],['resetdone','Password updated','Authentication'],['mfa','Two-step verification','Authentication'],['recovery','Recovery code','Authentication'],['expired','Session expired','Authentication'],
  ['eligible','Start practice setup','New practice'],['practice','Practice details','New practice'],['location','First location','New practice'],['review','Review & create','New practice'],['creating','Setup in progress','New practice'],['created','Practice created','New practice'],['invite','Invite a teammate · optional','New practice'],['invitesent','Invitation sent','New practice'],['approvemember','Confirm teammate access','New practice'],['memberactive','Teammate access confirmed','New practice'],['owneraccess','Owner location access · optional','New practice'],['resumesetup','Resume practice setup','New practice'],['restricted','Setup approval needed','New practice'],
  ['join','Accept invitation','Team & access'],['pending','Awaiting owner approval','Team & access'],['invitationexpired','Invitation expired','Team & access'],['wrongemail','Different invited email','Team & access'],['choosepractice','Choose practice','Team & access'],['chooselocation','Choose working location','Team & access'],['noaccess','Owner location access needed','Team & access'],['membernoaccess','Staff location access needed','Team & access'],['removed','Access removed','Team & access'],['accesserror','Access check unavailable','Team & access'],['workspace','Workspace entry','Team & access']
 ];
 const setupSteps={practice:0,location:1,review:2,creating:2};
 const deviceZone=Intl.DateTimeFormat().resolvedOptions().timeZone||'America/Los_Angeles';
 const allZones=Array.from(new Set([deviceZone,'America/Los_Angeles','America/Denver','America/Chicago','America/New_York','Europe/London','Australia/Sydney',...(Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):[]) ]));
 const state={platform:'web',screen:'signin',scenario:'owner',email:'alex@marlow.example',name:'Alex Morgan',practice:'Marlow Family Practice',location:'Main location',timezone:deviceZone,address:'',ownerClinical:false,memberEmail:'sam@marlow.example',role:'org:member',assigned:false,inviteContext:false,created:false,submitted:false,assignedLocations:[],workingLocation:''};
 const design={radius:10,spacing:'Comfortable'};
 function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function icon(name){return `<i data-lucide="${name}" aria-hidden="true"></i>`;}
 function link(text,go){return `<button class="cq-text-button cursor-interaction" type="button" data-go="${go}">${text}</button>`;}
 function action(text,a){return `<button class="cq-text-button cursor-interaction" type="button" data-action="${a}">${text}</button>`;}
 function primary(text,go){return `<button type="button" class="cq-primary cursor-interaction" data-go="${go}">${text}${icon('arrow-right')}</button>`;}
 function secondary(text,go){return `<button type="button" class="cq-secondary cursor-interaction" data-go="${go}">${text}</button>`;}
 function submit(text){return `<button type="submit" class="cq-primary cursor-interaction">${text}${icon('arrow-right')}</button>`;}
 function field(label,name,value='',opts={}){let type=opts.type||'text';return `<label class="cq-field" for="cq-${name}"><span>${label}</span><input class="cq-input" id="cq-${name}" name="${name}" type="${type}" value="${esc(value)}" ${opts.required===false?'':'required'} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''} ${opts.autocomplete?`autocomplete="${opts.autocomplete}"`:''} ${opts.maxlength?`maxlength="${opts.maxlength}"`:''}>${opts.hint?`<small>${opts.hint}</small>`:''}</label>`;}
 function password(label,name,forgot=false){return `<div class="cq-field"><div class="cq-field-top"><label for="cq-${name}">${label}</label>${forgot?link('Forgot password?','forgot'):''}</div><div class="cq-password-wrap"><input class="cq-input" id="cq-${name}" name="${name}" type="password" required ${name==='password'&&state.screen==='signin'?'':'minlength="8"'} autocomplete="${state.screen==='signin'?'current-password':'new-password'}" placeholder="${state.screen==='signin'?'Enter your password':'Create a password'}"><button type="button" class="cq-reveal cursor-interaction" data-action="reveal" aria-label="Show ${label.toLowerCase()}" aria-pressed="false">${icon('eye')}</button></div>${state.screen==='signup'||state.screen==='reset'?'<small>Use at least 8 characters.</small>':''}</div>`;}
 function error(){return '<p class="cq-error" id="cq-form-error" role="alert"></p>';}
 function feedback(){return '<p class="cq-feedback" id="cq-form-feedback" role="status"></p>';}
 function codeForm(target,button='Verify & continue'){return `<form class="cq-form" data-form="${target}"><label class="cq-field" for="cq-code"><span>Verification code</span><input id="cq-code" name="code" class="cq-input cq-code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-describedby="cq-code-hint"><small id="cq-code-hint">Enter the 6-digit code. You can paste it here.</small></label>${error()}${submit(button)}${feedback()}</form>`;}
 function note(text,i='info'){return `<div class="cq-note">${icon(i)}<span>${text}</span></div>`;}
 function back(text,go){return `<button type="button" class="cq-text-button cq-back cursor-interaction" data-go="${go}">${icon('arrow-left')}${text}</button>`;}
 function progress(){const n=setupSteps[state.screen];if(n===undefined)return '';return `<div class="cq-onboard-progress"><div class="cq-progress-label"><span>Practice setup</span><span>Step ${n+1} of 3</span></div><div class="cq-progress-track" role="progressbar" aria-label="Practice setup progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${n+1}"><span style="width:${(n+1)/3*100}%"></span></div></div>`;}
 function heading(title,lead,opts={}){return `${opts.back?back(opts.back[0],opts.back[1]):''}${progress()}${opts.mark?`<div class="cq-success-mark">${icon(opts.mark)}</div>`:''}${opts.eyebrow?`<div class="cq-eyebrow">${opts.eyebrow}</div>`:''}<h1 id="cq-page-title">${title}</h1><p class="cq-lead">${lead}</p>`;}
 function timezoneLabel(zone=state.timezone){return ({'America/Los_Angeles':'Pacific Time (US & Canada)','America/Denver':'Mountain Time (US & Canada)','America/Chicago':'Central Time (US & Canada)','America/New_York':'Eastern Time (US & Canada)','Europe/London':'London','Australia/Sydney':'Sydney'})[zone]||zone.replace(/_/g,' ').split('/').reverse().join(' · ');}
 function account(){const initials=state.name.split(' ').filter(Boolean).map(s=>s[0]).slice(0,2).join('');return `<div class="cq-account-chip"><span class="cq-account-dot">${esc(initials)}</span><span>${esc(state.email)}</span></div>`;}
 function reviewSummary(edit=true){return `<div class="cq-summary"><section class="cq-summary-group"><div class="cq-summary-top"><h2>Practice</h2>${edit?link('Edit','practice'):''}</div><p class="cq-summary-value">${esc(state.practice)}</p><p class="cq-summary-meta">Owner · ${esc(state.name)}</p></section><section class="cq-summary-group"><div class="cq-summary-top"><h2>First location</h2>${edit?link('Edit','location'):''}</div><p class="cq-summary-value">${esc(state.location)}</p><p class="cq-summary-meta">${esc(timezoneLabel())}${state.address?`<br>${esc(state.address)}`:''}</p></section></div>`;}
 const views={
 signin:()=>heading('Welcome back',state.inviteContext?`Sign in with ${esc(state.memberEmail)} to join your practice.`:'Sign in to your CareIQ account.')+`<form class="cq-form" data-form="signin">${field('Email address','email',state.inviteContext?state.memberEmail:'',{type:'email',placeholder:'you@practice.com',autocomplete:'username'})}${password('Password','password',true)}${error()}${submit('Sign in')}</form><p class="cq-under-form">New to CareIQ? ${link('Create an account','signup')}</p>`,
 signup:()=>heading('Create your account',state.inviteContext?`Create an account with your invited email to join ${esc(state.practice)}.`:'A little more room to care. Start with your account.')+`<form class="cq-form" data-form="signup">${field('Full name','name','',{placeholder:'Alex Morgan',autocomplete:'name',maxlength:120})}${field('Work email','email',state.inviteContext?state.memberEmail:'',{type:'email',placeholder:'you@practice.com',autocomplete:'email'})}${password('Password','password')}${error()}${submit('Create account')}</form><p class="cq-policy">By creating an account, you agree to our<br>${action('Terms of Service','terms')} and ${action('Privacy Policy','privacy')}.</p><p class="cq-under-form">Already have an account? ${link('Sign in','signin')}</p>`,
 verify:()=>heading('Check your email',`We sent a verification code to <strong>${esc(state.email)}</strong>.`,{back:['Back','signup'],mark:'mail'})+codeForm('verify')+`<div class="cq-helper-row" style="margin-top:18px"><span>Didn't receive it?</span>${action('Resend code','resend')}</div><p class="cq-under-form">${action('Use a different email','changeemail')}</p>`,
 forgot:()=>heading('Reset your password','Enter your email and we’ll send a password reset link.',{back:['Back to sign in','signin']})+`<form class="cq-form" data-form="forgot">${field('Email address','email','',{type:'email',placeholder:'you@practice.com',autocomplete:'email'})}${error()}${submit('Send reset link')}</form>`,
 resetemail:()=>heading('Check your email',`If an account exists for <strong>${esc(state.email)}</strong>, you’ll receive a password reset link.`,{mark:'mail'})+note('The link expires. If it no longer works, request a new one.')+`<div class="cq-form-actions" style="margin-top:24px">${secondary('Back to sign in','signin')}${action('Send another link','resend')}${feedback()}</div>`,
 reset:()=>heading('Choose a new password','Use a password you haven’t used for this account.',{back:['Back to sign in','signin']})+`<form class="cq-form" data-form="reset">${password('New password','newpassword')}${password('Confirm password','confirm')}${error()}${submit('Update password')}</form>`,
 resetdone:()=>heading('Password updated','You’re ready to sign in with your new password.',{mark:'check'})+primary('Back to sign in','signin'),
 mfa:()=>heading('One more step','Enter the code from your authenticator app.',{back:['Back to sign in','signin'],mark:'shield-check'})+codeForm('mfa','Verify & sign in')+`<p class="cq-under-form">${link('Use a recovery code','recovery')}</p>`,
 recovery:()=>heading('Use a recovery code','Enter one of the recovery codes you saved when setting up two-step verification.',{back:['Back to verification','mfa']})+`<form class="cq-form" data-form="recovery">${field('Recovery code','recoverycode','',{placeholder:'Enter your saved code',autocomplete:'off',hint:'Each recovery code can only be used once.'})}${error()}${submit('Verify & sign in')}</form><p class="cq-under-form">${action('Can’t access your account?','help')}</p>`,
 expired:()=>heading('Sign in again','Your session has expired. Sign in to continue where you left off.',{mark:'lock-keyhole'})+primary('Sign in','signin'),
 eligible:()=>heading('Let’s set up your practice','Just the essentials to get started. You can add your team and more locations later.',{eyebrow:'Welcome to CareIQ'})+account()+`<div class="cq-list"><div class="cq-list-row">${icon('building-2')}<div><strong>Your practice</strong><small>The name your team will see.</small></div></div><div class="cq-list-row">${icon('map-pin')}<div><strong>Your first location</strong><small>A name and time zone.</small></div></div><div class="cq-list-row">${icon('clipboard-check')}<div><strong>Review & create</strong><small>Confirm your details.</small></div></div></div>${primary('Set up my practice','practice')}`,
 practice:()=>heading('What’s your practice called?','Use the name your team will recognize.')+`<form class="cq-form" data-form="practice">${field('Practice name','practice',state.practice,{autocomplete:'organization',maxlength:120,hint:'This will appear in your practice workspace.'})}${error()}<div class="cq-form-actions">${submit('Continue')}${action('Save & finish later','save')}</div></form>`,
 location:()=>heading('Add your first location','Start with one location. You can add more later.',{back:['Back','practice']})+`<form class="cq-form" data-form="location">${field('Location name','location',state.location,{maxlength:120,placeholder:'Main location'})}<label class="cq-field" for="cq-timezone"><span>Time zone</span><select class="cq-input" name="timezone" id="cq-timezone">${allZones.map(v=>`<option value="${v}" ${v===state.timezone?'selected':''}>${esc(timezoneLabel(v))}</option>`).join('')}</select><small>Suggested from your device. Check that it matches this location.</small></label><details class="cq-details" ${state.address?'open':''}><summary class="cursor-interaction">${icon('plus')}Add address <span style="color:var(--cq-muted)">(optional)</span></summary>${field('Street address','address',state.address,{required:false,autocomplete:'street-address',maxlength:500,placeholder:'Street, city, state and postal code'})}</details>${error()}<div class="cq-form-actions">${submit('Review practice')}${action('Save & finish later','save')}</div></form>`,
 review:()=>heading('Everything look right?','Review your details before creating your practice.',{back:['Back','location']})+reviewSummary()+`<form class="cq-form" data-form="review"><label class="cq-check"><input type="checkbox" name="authority" required><span>I’m authorized to set up and manage this practice.</span></label>${error()}${submit('Create practice')}<p class="cq-policy" style="text-align:left;margin-top:0!important">Team invitations and location access come next.</p></form>`,
 creating:()=>heading('Finishing your setup','Your practice setup is in progress. Your submitted details are kept together.',{mark:'loader-circle'})+reviewSummary(false)+note('If this takes longer than expected, check the same setup again. You won’t need to start a second practice.')+`<div class="cq-form-actions" style="margin-top:24px">${primary('Check setup status','created')}${action('I’ll come back later','save')}</div>`,
 created:()=>heading('Your practice is ready',`${esc(state.practice)} and its first location have been created.`,{mark:'check',eyebrow:'Practice created'})+`<div class="cq-list"><div class="cq-list-row">${icon('building-2')}<div><strong>${esc(state.practice)}</strong><small>You’re the practice owner.</small></div></div><div class="cq-list-row">${icon('map-pin')}<div><strong>${esc(state.location)}</strong><small>${esc(timezoneLabel())}</small></div></div></div>${primary('Continue to practice',state.ownerClinical?'chooselocation':'noaccess')}<div class="cq-form-actions">${secondary('Invite a teammate','invite')}${link('Set my location access','owneraccess')}</div>`,
 invite:()=>heading('Invite a teammate','They’ll receive an email invitation. You’ll confirm their access after they join.',{back:['Back to your practice','created'],eyebrow:'Optional'})+`<form class="cq-form" data-form="invite">${field('Work email','memberEmail',state.memberEmail,{type:'email',autocomplete:'email'})}<label class="cq-field" for="cq-role"><span>Role</span><select name="role" class="cq-input" id="cq-role"><option value="org:member">Member</option><option value="org:admin">Administrator</option></select><small>Roles do not give access to patient records on their own.</small></label><fieldset style="border:0;padding:0;margin:0"><legend style="font-size:13px;margin-bottom:10px">Proposed location access</legend><label class="cq-choice cursor-interaction"><input type="checkbox" name="inviteLocation"><span class="cq-choice-copy"><strong>${esc(state.location)}</strong><small>Only this location.</small></span></label></fieldset>${error()}${submit('Send invitation')}${link('I’ll do this later','created')}</form>`,
 invitesent:()=>heading('Invitation sent',`We sent an invitation to <strong>${esc(state.memberEmail)}</strong>.`,{mark:'mail-check'})+note('Their access will stay pending until you confirm their role and locations after they join.')+`<div class="cq-form-actions" style="margin-top:24px">${primary('Back to your practice','created')}${secondary('Invite another teammate','invite')}</div>`,
 approvemember:()=>heading('Confirm teammate access','Sam has joined your practice. Review their role and locations before activating access.',{back:['Back to your practice','created'],eyebrow:'Owner review'})+`<div class="cq-account-chip"><span class="cq-account-dot">SP</span><span>${esc(state.memberEmail)}</span></div><form class="cq-form" data-form="approvemember"><label class="cq-field" for="cq-approved-role"><span>Role</span><select name="approvedRole" id="cq-approved-role" class="cq-input"><option value="org:member">Member</option><option value="org:admin">Administrator</option></select></label><fieldset style="border:0;padding:0;margin:0"><legend style="font-size:13px;margin-bottom:12px">Confirm clinical location access</legend><label class="cq-choice cursor-interaction"><input type="checkbox" name="approvedLocation"><span class="cq-choice-copy"><strong>${esc(state.location)}</strong><small>Access to records at this location only.</small></span></label></fieldset>${note('Without a location assignment, this teammate won’t be able to open patient records.')}${error()}${submit('Confirm access')}</form>`,
 memberactive:()=>heading('Team access confirmed',state.assigned?`Sam can work at ${esc(state.location)} with the role you approved.`:'Sam’s role is confirmed. Assign an active location when they need access to patient records.',{mark:'user-check'})+primary('Back to your practice','created')+`<p class="cq-under-form">${link('Review teammate access','approvemember')}</p>`,
 owneraccess:()=>heading('Set your location access','Owner access lets you manage the practice. Choose where you also need access to patient records.',{back:['Back to your practice','created'],eyebrow:'Your access'})+`<form class="cq-form" data-form="owneraccess"><fieldset style="border:0;padding:0;margin:0"><legend style="font-size:13px;margin-bottom:12px">Assign yourself to a location</legend><label class="cq-choice cursor-interaction"><input type="checkbox" name="ownerClinical" ${state.ownerClinical?'checked':''}><span class="cq-choice-copy"><strong>${esc(state.location)}</strong><small>${esc(state.practice)}</small></span></label></fieldset>${error()}${submit('Save my location access')}${link('Keep management access only','noaccess')}</form>`,
 resumesetup:()=>heading(`Welcome back, ${esc(state.name.split(' ')[0])}`,state.submitted?'Your submitted setup is still being checked. Continue with the same details.':'Your practice setup is waiting. Continue from your last completed step.',{mark:'bookmark-check'})+`<div class="cq-summary"><section class="cq-summary-group"><div class="cq-summary-top"><h2>Practice setup</h2></div><p class="cq-summary-value">${esc(state.practice)}</p><p class="cq-summary-meta">${state.submitted?'Submitted · Checking setup status':'Next · Add your first location'}</p></section></div>${primary(state.submitted?'Check setup status':'Continue setup',state.submitted?'creating':'location')}${state.submitted?'':`<p class="cq-under-form">${link('Start at practice details','practice')}</p>`}`,
 restricted:()=>heading('Practice setup needs approval','Your account is ready. New practice setup is currently available to approved practice owners.',{mark:'building-2'})+account()+note('If you were invited to an existing practice, use the invitation sent to your email.')+`<div class="cq-form-actions" style="margin-top:24px"><button class="cq-primary cursor-interaction" type="button" data-action="help">Get setup help${icon('arrow-right')}</button>${secondary('View my invitations','join')}${link('Use another account','signin')}</div>`,
 join:()=>heading('You’re invited to join',`${esc(state.practice)} has invited you to their team.`,{mark:'users'})+account()+`<div class="cq-summary"><section class="cq-summary-group"><div class="cq-summary-top"><h2>Invitation for</h2></div><p class="cq-summary-value">${esc(state.memberEmail)}</p><p class="cq-summary-meta">Practice · ${esc(state.practice)}</p></section></div>${note('After you join, the practice owner will confirm your role and location access.')}<div class="cq-form-actions" style="margin-top:24px"><button type="button" class="cq-primary cursor-interaction" data-action="acceptinvite">Accept invitation${icon('arrow-right')}</button>${link('Sign in with another account','wrongemail')}</div>`,
 pending:()=>heading('You’ve joined the team','Your practice owner will confirm your role and locations before you can open patient records.',{mark:'clock-3'})+`<div class="cq-summary"><section class="cq-summary-group"><div class="cq-summary-top"><h2>Practice</h2></div><p class="cq-summary-value">${esc(state.practice)}</p><p class="cq-summary-meta">Awaiting owner approval</p></section></div><button class="cq-primary cursor-interaction" type="button" data-action="pendingcheck">Check again${icon('refresh-cw')}</button>${feedback()}<p class="cq-under-form">${link('Switch practice','choosepractice')} · ${link('Sign out','signin')}</p>`,
 invitationexpired:()=>heading('This invitation has expired','Ask your practice owner to send you a new invitation.',{mark:'mail-x'})+note(`Your account is still available. You can use an active invitation to join ${esc(state.practice)}.`)+`<div class="cq-form-actions" style="margin-top:24px">${primary('Back to sign in','signin')}${action('Need help?','help')}</div>`,
 wrongemail:()=>heading('Use your invited email',`This invitation was sent to <strong>${esc(state.memberEmail)}</strong>. Sign in with that email to join.`,{mark:'mail'})+account()+primary('Use another account','signin')+`<p class="cq-under-form">${action('Need help?','help')}</p>`,
 choosepractice:()=>heading('Choose your practice','Continue with one of the practices you belong to.')+`<div class="cq-row-options"><button class="cq-choice cursor-interaction" type="button" data-go="${state.assignedLocations.length?'chooselocation':state.scenario==='member'?'membernoaccess':'noaccess'}">${icon('building-2')}<span class="cq-choice-copy"><strong>${esc(state.practice)}</strong><small>${state.scenario==='member'?'Member':'Owner'}</small></span>${icon('chevron-right')}</button><button class="cq-choice cursor-interaction" type="button" data-go="pending">${icon('building-2')}<span class="cq-choice-copy"><strong>Northside Care</strong><small>Awaiting owner approval</small></span>${icon('chevron-right')}</button></div><p class="cq-under-form">${link('View invitations','join')} · ${link('Sign out','signin')}</p>`,
 chooselocation:()=>heading('Where are you working?',`Choose an assigned location in ${esc(state.practice)}.`,{back:['Switch practice','choosepractice']})+`<form class="cq-form" data-form="chooselocation"><div class="cq-row-options" style="margin:0">${state.assignedLocations.map((loc,i)=>`<label class="cq-choice cursor-interaction"><input type="radio" name="working" value="${i}" required ${state.assignedLocations.length===1?'checked':''}><span class="cq-choice-copy"><strong>${esc(loc)}</strong><small>${esc(timezoneLabel())}</small></span></label>`).join('')}</div>${error()}${submit('Continue')}</form><p class="cq-under-form">Missing a location? ${action('Get help','help')}</p>`,
 noaccess:()=>heading('Choose your next step','You can manage your practice. Patient records will be available after you assign yourself a location.',{mark:'map-pin'})+`<div class="cq-form-actions">${primary('Set my location access','owneraccess')}${secondary('Invite your team','invite')}${link('Back to practice overview','created')}</div>`,
 membernoaccess:()=>heading('Your location access is being set up','Ask your practice owner to assign you an active location before opening patient records.',{mark:'map-pin'})+`<button type="button" class="cq-primary cursor-interaction" data-action="pendingcheck">Check again${icon('refresh-cw')}</button>${feedback()}<p class="cq-under-form">${link('Switch practice','choosepractice')} · ${link('Sign out','signin')}</p>`,
 removed:()=>heading('Your access has changed','You can’t open this practice right now. Ask the practice owner to review your access.',{mark:'shield-alert'})+`<div class="cq-form-actions">${primary('Choose another practice','choosepractice')}${secondary('Sign out','signin')}</div>`,
 accesserror:()=>heading('We couldn’t check access','Your connection may have changed. Try again to continue.',{mark:'wifi-off'})+`<button class="cq-primary cursor-interaction" type="button" data-action="accessretry">Try again${icon('refresh-cw')}</button>${feedback()}<p class="cq-under-form">${link('Back to sign in','signin')}</p>`,
 workspace:()=>heading('You’re in the right place',`You’re working at <strong>${esc(state.workingLocation||state.location)}</strong> in ${esc(state.practice)}.`,{mark:'check'})+note('Your practice and working location will stay visible as you use CareIQ.')+`<div class="cq-form-actions" style="margin-top:24px">${secondary('Change working location','chooselocation')}${link('Back to practice overview','created')}</div>`
 };
 const captions={signin:'Authentication · Email + password, password manager support, clear recovery.',signup:'Account creation stays separate from practice creation.',verify:'Codes support paste and autofill. Resend and change-email actions remain visible.',mfa:'Shown when required by the configured identity provider. Recovery has a dedicated screen.',practice:'Owner onboarding · Three short steps. Only existing required practice details.',location:'Friendly time-zone labels map to IANA values. The optional address stays tucked away.',review:'Explicit ownership confirmation. Nothing creates until the final action.',creating:'A timeout stays with the original setup operation. Retry checks the same practice.',created:'Owner management access and clinical location access remain separate.',invite:'Optional after creation. Proposed locations are unchecked; owner approval follows acceptance.',owneraccess:'Explicit self assignment. A separate authorized save is required before patient access.',resumesetup:'Proposed draft-resume experience; cross-device saving requires implementation.',restricted:'Matches the current approved-founder rollout. Identity creation does not unlock provisioning.',join:'Accepting an invitation does not activate clinical access.',pending:'Owner review is a distinct state; no patient data is previewed.',chooselocation:'Only assigned, active locations appear. This example shows a multi-location member.',workspace:'Design endpoint. Clinical workspace screens are outside this design set.'};
 function buildPicker(){let group='';screens.forEach(([id,label,g])=>{if(g!==group){const optgroup=document.createElement('optgroup');optgroup.label=g;picker.append(optgroup);group=g;}const option=document.createElement('option');option.value=id;option.textContent=label;picker.lastElementChild.append(option);});}
 function persist(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{platform:state.platform,screen:state.screen},privateContent:{platform:state.platform,screen:state.screen,scenario:state.scenario,ownerClinical:state.ownerClinical,created:state.created,submitted:state.submitted}}).catch(()=>{});}
 function authDestination(){if(state.inviteContext||state.scenario==='invitee')return state.email.toLowerCase()===state.memberEmail.toLowerCase()?'join':'wrongemail';if(state.scenario==='restricted')return 'restricted';if(state.scenario==='member')return 'choosepractice';return state.created?'choosepractice':'eligible';}
 function go(id,save=true){if(!views[id])return;if(id==='join'){state.inviteContext=true;if(state.email.toLowerCase()!==state.memberEmail.toLowerCase())id='wrongemail';}if(id==='chooselocation'&&!state.assignedLocations.length)id=state.scenario==='member'?'membernoaccess':'noaccess';state.screen=id;render();if(save)persist();root.querySelector('#cq-preview-announcement').textContent=`${screens.find(s=>s[0]===id)[1]} · ${state.platform==='web'?'Web':state.platform==='ios'?'iOS':'Android'}`;const first=page.querySelector('input,select,button');if(first)first.focus({preventScroll:true});}
 function drawSidebar(){let n=setupSteps[state.screen];root.querySelector('#cq-setup-sidebar').innerHTML=`<h2 class="cq-sidebar-title">Your practice</h2><p class="cq-sidebar-sub">A few details to get started.</p><ol class="cq-step-list">${[['Practice','Your practice name'],['Location','Your first location'],['Review','Confirm & create']].map(([t,sub],i)=>`<li class="cq-step ${i<n?'cq-completed':''}" ${i===n?'aria-current="step"':''}><span class="cq-step-number">${i<n?icon('check'):i+1}</span><div><strong>${t}</strong><small>${sub}</small></div></li>`).join('')}</ol><div class="cq-sidebar-bottom"><strong>Keep it simple.</strong>Add your team and more locations when you’re ready.</div>`;}
 function render(){const native=state.platform!=='web';product.className=`cq-product ${native?'cq-native cq-'+state.platform:''} ${setupSteps[state.screen]!==undefined?'cq-setup-mode':''}`;product.style.setProperty('--cq-radius',design.radius+'px');root.querySelector('#cq-preview-stage').className=native?'cq-mobile-stage viz-dotted-background':'';root.querySelector('#cq-native-status').innerHTML=`<span>9:41</span><span class="cq-status-right">${icon('signal')}${icon('wifi')}${icon('battery-full')}</span>`;drawSidebar();page.innerHTML=`<div class="cq-content ${['eligible','practice','location','review','creating','created','invite','owneraccess','noaccess'].includes(state.screen)?'cq-wide':''}">${views[state.screen]()}</div>`;picker.value=state.screen;root.querySelector('#cq-path-picker').value=state.scenario;root.querySelectorAll('[data-platform]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.platform===state.platform?'true':'false'));root.querySelector('#cq-screen-count').textContent=`${screens.findIndex(s=>s[0]===state.screen)+1} / ${screens.length}`;root.querySelector('#cq-design-caption').textContent=captions[state.screen]||'Authentication & access · White backgrounds, restrained sage, one clear next action.';root.querySelector('#cq-footer-context').textContent=setupSteps[state.screen]!==undefined?'Your practice. One step at a time.':'A little more room to care.';if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
 function tell(msg,errorMsg=false){const el=page.querySelector(errorMsg?'#cq-form-error':'#cq-form-feedback');if(el)el.textContent=msg;}
 function support(type){const opener=document.activeElement;const overlay=document.createElement('section');overlay.className='cq-support';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label',type==='help'?'CareIQ help':type==='terms'?'Terms of Service':'Privacy Policy');const copy=type==='help'?['A little help getting started','For practice access, contact your practice owner. For account or new practice setup, reach CareIQ support.']:type==='terms'?['Terms of Service','This link will open the current CareIQ terms. Your unfinished account setup will remain available.']:['Privacy Policy','This link will open the current CareIQ privacy policy. Your unfinished account setup will remain available.'];overlay.innerHTML=`<div class="cq-support-head"><h2>${copy[0]}</h2><button type="button" class="cq-text-button cursor-interaction" data-action="close">Close</button></div><p>${copy[1]}</p>${type==='help'?note('An invitation may use a different email. Sign in with the address it was sent to.'):''}<button type="button" class="cq-secondary cursor-interaction" data-action="close">Back to ${state.screen==='signup'?'account setup':'CareIQ'}</button>`;product.append(overlay);const siblings=[...product.children].filter(c=>c!==overlay).concat([...root.children].filter(c=>c.id!=='cq-preview-stage'));siblings.forEach(c=>c.inert=true);overlay._siblings=siblings;overlay._opener=opener;overlay.querySelector('button').focus();if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
 function closeSupport(o){o._siblings.forEach(c=>c.inert=false);const opener=o._opener;o.remove();if(opener&&opener.isConnected)opener.focus();}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.type==='submit'){e.preventDefault();const form=b.closest('form');if(form&&form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}
  if(b.dataset.platform){state.platform=b.dataset.platform;render();persist();return;}
  if(b.dataset.preview){let i=screens.findIndex(s=>s[0]===state.screen);i=(i+(b.dataset.preview==='next'?1:-1)+screens.length)%screens.length;picker.value=screens[i][0];picker.dispatchEvent(new Event('change',{bubbles:true}));return;}
  if(b.dataset.go){if(state.screen==='wrongemail'&&b.dataset.go==='signin')state.inviteContext=true;if(state.screen==='creating'&&b.dataset.go==='created')state.created=true;go(b.dataset.go);return;}
  const a=b.dataset.action;
  if(a==='reveal'){const input=b.parentElement.querySelector('input');input.type=input.type==='password'?'text':'password';b.setAttribute('aria-pressed',input.type==='text'?'true':'false');b.setAttribute('aria-label',input.type==='text'?'Hide password':'Show password');b.innerHTML=icon(input.type==='text'?'eye-off':'eye');if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
  if(a==='resend'){tell(state.screen==='resetemail'?'If an account exists, a new link will arrive shortly.':'A new code was sent. Check your email.');b.disabled=true;setTimeout(()=>{if(b.isConnected)b.disabled=false;},1000);}
  if(a==='changeemail')go('signup');
  if(a==='save'){const form=page.querySelector('form');if(form){const f=new FormData(form);['practice','location','timezone','address'].forEach(k=>{if(f.has(k))state[k]=String(f.get(k)).trim();});}go('resumesetup');}
  if(a==='pendingcheck')tell(state.screen==='membernoaccess'?'No active location has been assigned yet. Check with your practice owner.':'Still awaiting owner approval. You can check again later.');
  if(a==='acceptinvite'){state.inviteContext=true;go(state.email.toLowerCase()===state.memberEmail.toLowerCase()?'pending':'wrongemail');}
  if(a==='accessretry')tell('Access check is still unavailable. Please try again.');
  if(['help','terms','privacy'].includes(a))support(a);
  if(a==='close')closeSupport(b.closest('.cq-support'));
 });
 root.addEventListener('keydown',e=>{const o=product.querySelector('.cq-support');if(!o)return;if(e.key==='Escape'){e.preventDefault();closeSupport(o);}if(e.key==='Tab'){const buttons=[...o.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}}});
 picker.addEventListener('change',()=>{const id=picker.value;if(['join','pending'].includes(id)){state.email=state.memberEmail;state.name='Sam Patel';state.scenario='invitee';state.inviteContext=true;}if(id==='wrongemail'){state.email='alex@marlow.example';state.inviteContext=true;}if(['choosepractice','chooselocation','workspace'].includes(id)){state.scenario='member';state.assignedLocations=[state.location,'North office'];state.workingLocation=state.location;}if(['created','noaccess','owneraccess'].includes(id)){state.scenario='owner';state.name='Alex Morgan';state.inviteContext=false;state.created=true;state.assignedLocations=[];state.ownerClinical=false;}if(id==='restricted')state.scenario='restricted';if(['eligible','practice','location','review'].includes(id)){state.scenario='owner';state.inviteContext=false;state.submitted=false;state.created=false;state.assignedLocations=[];}go(id);});
 root.querySelector('#cq-path-picker').addEventListener('change',e=>{state.scenario=e.target.value;state.inviteContext=state.scenario==='invitee';state.email=state.inviteContext?state.memberEmail:'alex@marlow.example';state.name=state.inviteContext?'Sam Patel':'Alex Morgan';state.created=state.scenario==='member';state.submitted=false;state.ownerClinical=false;state.assignedLocations=state.scenario==='member'?[state.location,'North office']:[];go('signin');});
 page.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(!form.checkValidity()){form.reportValidity();return;}const f=new FormData(form),kind=form.dataset.form;
  if(kind==='signin'){state.email=String(f.get('email'));go(authDestination());}
  if(kind==='signup'){state.email=String(f.get('email'));state.name=String(f.get('name')).trim();go('verify');}
  if(kind==='verify'){if(String(f.get('code'))==='000000'){tell('That code isn’t valid. Check your email and try again.',true);form.querySelector('input').setAttribute('aria-invalid','true');return;}go(authDestination());}
  if(kind==='forgot'){state.email=String(f.get('email'));go('resetemail');}
  if(kind==='reset'){if(f.get('newpassword')!==f.get('confirm')){tell('The passwords don’t match. Try again.',true);form.querySelector('#cq-confirm').setAttribute('aria-invalid','true');return;}go('resetdone');}
  if(kind==='mfa'){if(f.get('code')==='000000'){tell('That code isn’t valid. Enter the latest code from your app.',true);return;}go(authDestination());}
  if(kind==='recovery')go(authDestination());
  if(kind==='practice'){state.practice=String(f.get('practice')).trim();if(!state.practice){tell('Enter your practice name.',true);return;}go('location');}
  if(kind==='location'){state.location=String(f.get('location')).trim();state.timezone=String(f.get('timezone'));state.address=String(f.get('address')||'').trim();if(!state.location){tell('Enter a location name.',true);return;}go('review');}
  if(kind==='review'){state.submitted=true;go('creating');}
  if(kind==='invite'){state.memberEmail=String(f.get('memberEmail')).trim();state.role=String(f.get('role'));state.assigned=f.has('inviteLocation');go('invitesent');}
  if(kind==='approvemember'){state.role=String(f.get('approvedRole'));state.assigned=f.has('approvedLocation');go('memberactive');}
  if(kind==='owneraccess'){state.ownerClinical=f.has('ownerClinical');state.assignedLocations=state.ownerClinical?[state.location]:[];go(state.ownerClinical?'chooselocation':'noaccess');}
  if(kind==='chooselocation'){const loc=state.assignedLocations[Number(f.get('working'))];if(!loc){tell('Choose one of your assigned locations.',true);return;}state.workingLocation=loc;go('workspace');}
 });
 buildPicker();
 function restorePreview(v){if(['web','ios','android'].includes(v.platform))state.platform=v.platform;if(['owner','invitee','restricted','member'].includes(v.scenario))state.scenario=v.scenario;state.ownerClinical=!!v.ownerClinical;state.created=!!v.created;state.submitted=!!v.submitted;state.inviteContext=state.scenario==='invitee';if(state.inviteContext){state.email=state.memberEmail;state.name='Sam Patel';}state.assignedLocations=state.ownerClinical?[state.location]:state.scenario==='member'?[state.location,'North office']:[];if(views[v.screen])state.screen=v.screen;if(state.screen==='chooselocation'&&!state.assignedLocations.length)state.screen=state.scenario==='member'?'membernoaccess':'noaccess';}
 const restore=window.openai&&window.openai.widgetState;const saved=restore&&(restore.privateContent||restore.modelContent||restore);if(saved)restorePreview(saved);
 render();
 window.addEventListener('openai:set_globals',e=>{const s=e.detail&&e.detail.globals&&e.detail.globals.widgetState;if(!s)return;const v=s.privateContent||s.modelContent||s;if(v.screen===state.screen&&v.platform===state.platform&&v.scenario===state.scenario&&!!v.ownerClinical===state.ownerClinical&&!!v.created===state.created&&!!v.submitted===state.submitted)return;restorePreview(v);if(state.screen==='wrongemail'){state.email='alex@marlow.example';state.name='Alex Morgan';}render();});
 if(globalThis.Tweak){const tweak=new Tweak({container:product,onChange:()=>product.style.setProperty('--cq-radius',design.radius+'px')});tweak.addSlider(design,'radius',{label:'Control corners',min:6,max:14,step:1,unit:'px',reference:'--cq-radius'});}
})();
</script>
